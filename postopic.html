<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b8a3e"><link rel="icon" href="https://i.imgur.com/d6TxLMp.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="admin.css"><title>ZamHub | Topics</title></head><body>
<header class="top"><a class="ibtn" href="web5.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><img src="https://i.imgur.com/d6TxLMp.png" alt="ZamHub"><h1>Topics</h1><button class="ibtn" data-logout aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button></header>
<main id="app" hidden class="wrap">
<section class="panel" id="findBox"><h2>Find a course</h2>
<form class="fm" id="findForm"><label><span>Course code</span><input id="fCode" required></label><button class="btn" type="submit">Open course</button></form></section>

<section class="panel" id="courseBox" hidden>
<div class="course-head"><img id="cImg" alt="Course"><div><b id="cName"></b><br><small id="cCode"></small><br><span class="badge" id="cCount"></span></div></div>
<div class="acts" style="margin-top:14px">
<button class="btn" id="bAdd" type="button"><i class="fa-solid fa-plus"></i> Add topic</button>
<button class="btn line" id="bView" type="button"><i class="fa-solid fa-eye"></i> View topics</button>
<button class="btn line" id="bEditC" type="button"><i class="fa-solid fa-pen"></i> Edit course</button>
</div></section>

<section class="panel" id="topicForm" hidden><h2 id="tTitle"></h2>
<form class="fm" id="tf" novalidate>
<label><span>Topic name</span><input id="tName" required></label>
<label><span>Video link</span><input id="tVideo" type="url" placeholder="https://"></label>
<label><span>Topic text</span><textarea id="tText"></textarea></label>
<div><span style="display:block;font-size:.85rem;font-weight:600;color:var(--green-d);margin-bottom:5px">Is this the last topic before the exam?</span>
<div class="seg"><button type="button" id="finNo" class="on no">No</button><button type="button" id="finYes">Yes</button></div></div>
<div class="acts"><button class="btn" id="tSave" type="submit">Save topic</button><button class="btn line" id="tCancel" type="button">Cancel</button></div>
</form></section>

<section class="panel" id="listBox" hidden><h2>Topics</h2><div class="tl" id="tl"></div></section>

<section class="panel" id="courseForm" hidden><h2>Edit course</h2>
<form class="fm" id="cf" novalidate>
<div class="row"><label><span>Course name</span><input id="eName" required></label><label><span>Course code</span><input id="eCode" required></label></div>
<div class="row"><label><span>Price (₦)</span><input id="ePrice" type="number" min="0" step="any" required></label>
<label><span>Payment type</span><select id="eBilling"><option value="one_time">One time</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label></div>
<label><span>Course description</span><textarea id="eDesc"></textarea></label>
<label><span>Image link</span><input id="eImg" type="url"></label>
<label><span>Or upload a new image</span><input id="eFile" type="file" accept="image/*"></label>
<div class="acts"><button class="btn" id="cSave" type="submit">Save changes</button><button class="btn line" id="cCancel" type="button">Cancel</button></div>
</form></section>
</main>
<script type="module" src="postopic.js"></script></body></html>
