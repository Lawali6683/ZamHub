<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b8a3e"><link rel="icon" href="https://i.imgur.com/d6TxLMp.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="admin.css"><title>ZamHub | Add course</title></head><body>
<header class="top"><a class="ibtn" href="web5.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><img src="https://i.imgur.com/d6TxLMp.png" alt="ZamHub"><h1>Add course</h1><button class="ibtn" data-logout aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button></header>
<main id="app" hidden class="wrap"><section class="panel"><h2>New course</h2>
<form class="fm" id="form" novalidate>
<div class="row">
<label><span>Course name</span><input id="name" required></label>
<label><span>Course code</span><input id="code" required></label>
</div>
<div class="row">
<label><span>Price (₦)</span><input id="price" type="number" min="0" step="any" inputmode="decimal" required></label>
<label><span>Payment type</span><select id="billing" required><option value="">Select payment type</option><option value="one_time">One time</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label>
</div>
<label><span>Course description</span><textarea id="desc" required></textarea></label>
<label><span>Image link</span><input id="img" type="url" placeholder="https://"></label>
<label><span>Or upload from your device</span><input id="file" type="file" accept="image/*"></label>
<img id="prev" class="preview" alt="Course image preview" hidden>
<button class="btn" id="go" type="submit">Save course</button>
</form></section></main>
<script type="module" src="shotpost.js"></script></body></html>
