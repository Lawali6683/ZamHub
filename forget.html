<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b8a3e"><link rel="icon" href="https://i.imgur.com/d6TxLMp.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="site.css"><title>ZamHub | Reset password</title></head><body>
<div id="hdr"></div>
<main class="page w" style="max-width:480px"><h1>Reset password</h1><div class="card">
<form class="fm" id="reqForm" novalidate><p>Enter your email and we will send you a reset link.</p><label><span>Email</span><input id="em" type="email" autocomplete="email" required></label><button class="btn" type="submit">Send reset link</button></form>
<form class="fm" id="newForm" hidden novalidate><label><span>New password</span><input id="p1" type="password" autocomplete="new-password" required></label><label><span>Confirm password</span><input id="p2" type="password" autocomplete="new-password" required></label><button class="btn" type="submit">Save new password</button></form></div></main>
<script type="module" src="site.js"></script><script type="module" src="forget.js"></script></body></html>
