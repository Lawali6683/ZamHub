<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b8a3e"><link rel="icon" href="https://i.imgur.com/d6TxLMp.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="admin.css"><title>ZamHub | Assessment and exam</title></head><body>
<header class="top"><a class="ibtn" href="web5.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><img src="https://i.imgur.com/d6TxLMp.png" alt="ZamHub"><h1>Assessment and exam</h1><button class="ibtn" data-logout aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button></header>
<main id="app" hidden class="wrap">
<section class="panel"><h2>Find a course</h2><form class="fm" id="findForm"><label><span>Course code</span><input id="fCode" required></label><button class="btn" type="submit">Open course</button></form></section>
<section class="panel" id="info" hidden><h2 id="cName"></h2><div class="sum" id="cSum"></div><div class="tl" id="setList" style="margin-top:12px"></div></section>
<section class="panel" id="builder" hidden><h2>New quiz</h2>
<div class="fm">
<label><span>Type</span><select id="kind"><option value="assessment">Assessment (5 questions)</option><option value="exam">Final exam</option></select></label>
<div class="row">
<label id="toBox"><span>Covers topics up to (from <b id="fromNo"></b>)</span><input id="toTopic" type="number" min="1" inputmode="numeric"></label>
<label><span>Time (minutes)</span><input id="time" type="number" min="1" value="10" inputmode="numeric"></label>
<label><span>Marks needed to pass</span><input id="pass" type="number" min="1" value="3" inputmode="numeric"></label>
</div>
<div id="qlist" class="fm"></div>
<div class="acts" id="adders"><button class="btn line" id="addMcq" type="button">Add A-D question</button><button class="btn line" id="addTf" type="button">Add true/false</button></div>
<div class="sum" id="total"></div>
<button class="btn" id="save" type="button">Save quiz</button>
</div></section>
</main>
<script type="module" src="quizadmin.js"></script></body></html>
